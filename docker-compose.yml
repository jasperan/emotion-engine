services:
  oracle-db:
    image: gvenzl/oracle-free:latest-faststart
    ports:
      - "1522:1521"
    environment:
      - ORACLE_PASSWORD=oracle
      - APP_USER=emotionsim
      - APP_USER_PASSWORD=emotionsim
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/data
    environment:
      - ORACLE_DB_HOST=oracle-db
      - ORACLE_DB_PORT=1521
      - ORACLE_DB_SERVICE=FREEPDB1
      - ORACLE_DB_USER=emotionsim
      - ORACLE_DB_PASSWORD=emotionsim
      - VLLM_BASE_URL=${DOCKER_VLLM_BASE_URL:-http://host.docker.internal:8010}
      - VLLM_DEFAULT_MODEL=${DOCKER_VLLM_DEFAULT_MODEL:-Qwen/Qwen3.5-4B}
      - OLLAMA_BASE_URL=${DOCKER_OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      - OLLAMA_API_KEY=${DOCKER_OLLAMA_API_KEY:-ollama}
      - OLLAMA_DEFAULT_MODEL=${DOCKER_OLLAMA_DEFAULT_MODEL:-qwen3.5:4b}
      - OLLAMA_FALLBACK_MODEL=${DOCKER_OLLAMA_FALLBACK_MODEL:-qwen3.5:4b}
      - LLM_BACKEND=${DOCKER_LLM_BACKEND:-ollama}
      - DEBUG=false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      oracle-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  oracle_data:
  backend_data:
